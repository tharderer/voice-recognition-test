name: Build Blender Beast Godot Game
on:
  push:
    branches: [main]
    paths:
      - 'godot/beast/**'
      - '.github/workflows/build-beast.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-beast
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check strict recall rules
        run: node beast/tests/recall.cjs
      - name: Install Godot 4.4.1 and web template
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz templates/web_nothreads_release.zip -d /tmp
          python - <<'PY'
          from pathlib import Path
          p=Path('godot/beast/export_presets.cfg')
          text=p.read_text()
          import re
          text=re.sub(r'custom_template/release="[^"]*"','custom_template/release="/tmp/templates/web_nothreads_release.zip"',text)
          p.write_text(text)
          PY
      - name: Import and check game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/beast --editor --quit 2>&1 | tee /tmp/import.log
          if grep -q 'SCRIPT ERROR' /tmp/import.log; then exit 1; fi
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/beast --script smoke.gd 2>&1 | tee /tmp/smoke.log
          grep -q 'PASS: Blender models' /tmp/smoke.log
          if grep -q 'SCRIPT ERROR' /tmp/smoke.log; then exit 1; fi
      - name: Export browser game
        run: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/beast --export-release Web ../../beast/engine.html
      - name: Save playable game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beast/engine.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Export playable Blender and Godot Build a Beast game'
          git restore godot/beast/export_presets.cfg
          git pull --rebase origin main
          git push origin HEAD:main
