name: Build AB001 Blender and Godot Remake
on:
  push:
    branches: [main]
    paths:
      - 'godot/ab001-remake/**'
      - '.github/workflows/build-ab001-remake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-ab001-remake
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser interface
        run: node --check godot/ab001-remake/web/adventure.js
      - name: Install Godot 4.4.1 and web template
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz templates/web_nothreads_release.zip -d /tmp
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('godot/ab001-remake/export_presets.cfg')
          p.write_text(re.sub(r'custom_template/release="[^"]*"','custom_template/release="/tmp/templates/web_nothreads_release.zip"',p.read_text()))
          PY
      - name: Import and check four-chapter adventure
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/ab001-remake --editor --quit 2>&1 | tee /tmp/import.log
          if grep -q 'SCRIPT ERROR' /tmp/import.log; then exit 1; fi
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/ab001-remake --script smoke.gd 2>&1 | tee /tmp/smoke.log
          grep -q 'PASS: Blender models, four chapters' /tmp/smoke.log
          if grep -q 'SCRIPT ERROR' /tmp/smoke.log; then exit 1; fi
      - name: Export browser game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/ab001-remake --export-release Web ../../godot-ab001/engine.html
          cp godot/ab001-remake/web/* godot-ab001/
      - name: Save playable AB001 remake
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot-ab001/engine.* godot-ab001/index.html godot-ab001/adventure.css godot-ab001/adventure.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Export AB001 Road to Canaan Blender and Godot remake'
          git restore godot/ab001-remake/export_presets.cfg
          git pull --rebase origin main
          git push origin HEAD:main
