name: Build AB001 Godot Web
on:
  push:
    branches: [main]
    paths:
      - 'godot/ab001/build_project.py'
      - '.github/workflows/build-ab001-godot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write AB001 Godot source
        run: |
          python godot/ab001/build_project.py
          cp -R ../godot/ab001/. godot/ab001/
      - name: Rebuild custom AB001 art atlas
        run: |
          python godot/ab001/tools/rebuild_atlas.py
          python -m pip install --quiet pillow pillow-avif-plugin
          python - <<'PY'
          import pillow_avif
          from PIL import Image
          im=Image.open('godot/ab001/art/atlas.avif').convert('RGBA')
          im.save('godot/ab001/art/atlas.png')
          print('atlas', im.size)
          PY
      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L 'https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2' -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/ab001 --editor --quit
      - name: Export playable web build
        run: |
          rm -rf godot-ab001
          mkdir -p godot-ab001
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/ab001 --export-release 'Web' ../../godot-ab001/index.html
          touch godot-ab001/.nojekyll
      - name: Commit playable build and reconstructed atlas
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot-ab001 godot/ab001/project.godot godot/ab001/main.tscn godot/ab001/main.gd godot/ab001/export_presets.cfg godot/ab001/tools/rebuild_atlas.py godot/ab001/art/atlas.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build AB001 Godot web mission'
          git push
