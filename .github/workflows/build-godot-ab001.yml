name: Build AB001 Godot Web Game

on:
  push:
    branches: [main]
    paths:
      - 'godot-ab001/**'
      - '.github/workflows/build-godot-ab001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and web export templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2' -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          wget -q 'https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2' -O templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Apply source safety fix
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('godot-ab001/scripts/main.gd')
          text = p.read_text()
          text = text.replace(
              'var history_index := min(20 + i * 23, last_player_positions.size() - 1)',
              'var history_index: int = mini(20 + i * 23, last_player_positions.size() - 1)'
          )
          p.write_text(text)
          PY

      - name: Validate Godot project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-ab001 --editor --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' godot-import.log; then
            echo 'Godot reported a script error.'
            exit 1
          fi
          exit "$status"

      - name: Export Web build
        shell: bash
        run: |
          set -o pipefail
          rm -rf godot-ab001-play
          mkdir -p godot-ab001-play
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-ab001 --export-release Web ../godot-ab001-play/index.html 2>&1 | tee godot-export.log
          status=${PIPESTATUS[0]}
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' godot-export.log; then
            echo 'Godot reported a script error during export.'
            exit 1
          fi
          test "$status" -eq 0
          touch godot-ab001-play/.nojekyll

      - name: Commit corrected source and playable build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot-ab001/scripts/main.gd
          git add -f godot-ab001-play
          if git diff --cached --quiet; then
            echo 'No build changes to commit.'
          else
            git commit -m 'Fix and build AB001 Godot web game [skip ci]'
            git push
          fi
